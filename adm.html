<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración de Tareas - Asignación</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Se mantuvo la paleta, pero se optimizó el uso */
            --bg-dark: #121212; /* Fondo aún más oscuro para mayor contraste */
            --card-bg: #1e1e1e; /* Fondo principal de tarjeta */
            --text-primary: #e0e0e0;
            --text-secondary: #aaaaaa; /* Nuevo color para texto secundario/placeholder */
            --accent-cta: #00BCD4; /* Cian: se mantendrá para títulos y elementos principales */
            --accent-progress: #F4B400; /* Amarillo: se mantendrá para el botón de guardar */
            --accent-success: #4CAF50;
            --accent-red: #DB4437;
            
            --shadow-elevated: 0 12px 30px rgba(0, 0, 0, 0.7); /* Sombra más pronunciada */
            --border-radius-lg: 16px;
            --border-radius-sm: 8px;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Inter', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; /* Fuente ligeramente más moderna */
            padding: 50px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px; /* Se amplía el ancho para mejor distribución de 3 columnas */
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-elevated);
            border-top: 6px solid var(--accent-cta);
            animation: fadeIn 0.8s ease-out; /* Animación de carga sutil */
        }

        /* Animación de entrada */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: var(--accent-cta);
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.2rem; /* Título más grande */
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            text-align: center; 
            color: var(--accent-red); 
            margin-bottom: 30px; 
            font-size: 1.05rem;
            padding-bottom: 15px;
            border-bottom: 1px dashed #333;
        }

        /* --- Estilos para el nuevo Dashboard de Tareas --- */
        .task-summary-dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 columnas para 3 usuarios + Total */
            gap: 20px;
            margin-bottom: 40px;
            padding: 20px;
            background-color: #252525;
            border-radius: var(--border-radius-sm);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .summary-card {
            text-align: center;
            padding: 15px 10px;
            background-color: var(--card-bg);
            border-radius: 6px;
            border-bottom: 3px solid transparent;
            transition: transform 0.2s;
        }
        
        .summary-card:hover {
            transform: translateY(-2px);
        }

        .summary-card.total {
            background-color: var(--accent-cta);
            color: var(--bg-dark);
            border-bottom-color: var(--accent-progress);
        }

        .summary-card .count {
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 5px;
            display: block;
        }

        .summary-card .label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .summary-card.total .label {
            color: var(--bg-dark); /* Texto oscuro para el label en la tarjeta Total */
        }
        /* --- Fin de Estilos para Dashboard --- */

        .task-editor-section {
            /* Se usa grid explícito para un mejor control en pantallas grandes */
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 30px; /* Más espacio entre columnas */
            margin-bottom: 40px;
        }

        .task-editor-group {
            background-color: #252525; /* Fondo de grupo ligeramente diferente */
            padding: 25px;
            border-radius: var(--border-radius-sm);
            border: 1px solid #333;
            transition: box-shadow 0.3s;
        }
        
        .task-editor-group:hover {
            box-shadow: 0 0 15px rgba(0, 188, 212, 0.2); /* Resaltar al pasar el ratón */
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--accent-cta); /* Color acento para los labels */
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        label i {
            font-size: 1.1em;
        }

        textarea {
            width: 100%;
            min-height: 250px; /* Área de texto más alta por defecto */
            padding: 15px;
            border-radius: var(--border-radius-sm);
            border: 2px solid #444; /* Borde más definido */
            background-color: #121212; /* Mismo fondo que el body para una sensación inmersiva */
            color: var(--text-primary);
            font-size: 1rem;
            line-height: 1.5;
            resize: vertical;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        textarea:focus {
            border-color: var(--accent-progress); /* Destacar con el color de guardar al enfocar */
            box-shadow: 0 0 8px rgba(244, 180, 0, 0.5);
            outline: none;
        }
        
        textarea::placeholder {
            color: var(--text-secondary);
            font-style: italic;
        }

        .save-tasks-btn {
            width: 100%;
            padding: 18px; /* Botón más grande y prominente */
            border-radius: var(--border-radius-sm);
            background-color: var(--accent-progress);
            color: var(--bg-dark); /* Texto oscuro para mayor contraste */
            border: none;
            cursor: pointer;
            font-weight: 800;
            font-size: 1.35rem;
            box-shadow: 0 6px 15px rgba(244, 180, 0, 0.5);
            transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .save-tasks-btn:hover {
            background-color: #ffc93c; /* Tono más claro en hover */
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(244, 180, 0, 0.7);
        }
        
        .save-tasks-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        
        .save-tasks-btn i {
            margin-right: 8px;
        }

        /* Notificaciones flotantes para el Admin Panel - Ligeros ajustes */
        .notification-container {
            position: fixed;
            bottom: 30px; /* Un poco más arriba */
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--accent-success);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: var(--shadow-elevated);
            opacity: 0;
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
            justify-content: center;
        }
        .notification-container.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        /* Media Query para responsividad en móviles */
        @media (max-width: 850px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.6rem;
            }

            .task-summary-dashboard {
                grid-template-columns: repeat(2, 1fr); /* 2x2 en móvil */
            }

            .task-editor-section {
                grid-template-columns: 1fr; /* Una sola columna en móvil */
                gap: 20px;
            }
            
            textarea {
                min-height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-tools"></i> Panel de Administración de Tareas</h1>
        <p class="subtitle">
            ⚠️ Use esta página para definir las tareas iniciales de cada usuario. Escriba **una tarea por línea**.
        </p>

        <div class="task-summary-dashboard">
            <div class="summary-card">
                <span class="count" id="count-henry">0</span>
                <span class="label">Tareas de Henry</span>
            </div>
            <div class="summary-card">
                <span class="count" id="count-carlos">0</span>
                <span class="label">Tareas de Carlos</span>
            </div>
            <div class="summary-card">
                <span class="count" id="count-ammy">0</span>
                <span class="label">Tareas de Ammy</span>
            </div>
            <div class="summary-card total">
                <span class="count" id="count-total">0</span>
                <span class="label">TOTAL TAREAS</span>
            </div>
        </div>
        <div class="task-editor-section">
            <div class="task-editor-group">
                <label for="tasks-henry-textarea"><i class="fas fa-user-tie"></i> Tareas de Henry:</label>
                <textarea id="tasks-henry-textarea" placeholder="Escribe las tareas de Henry, una por línea..."></textarea>
            </div>
            
            <div class="task-editor-group">
                <label for="tasks-carlos-textarea"><i class="fas fa-user-secret"></i> Tareas de Carlos:</label>
                <textarea id="tasks-carlos-textarea" placeholder="Escribe las tareas de Carlos, una por línea..."></textarea>
            </div>

            <div class="task-editor-group">
                <label for="tasks-ammy-textarea"><i class="fas fa-user-tag"></i> Tareas de Ammy:</label>
                <textarea id="tasks-ammy-textarea" placeholder="Escribe las tareas de Ammy, una por línea..."></textarea>
            </div>
        </div>
        
        <button class="save-tasks-btn" id="save-tasks-btn">
            <i class="fas fa-save"></i> Guardar y Sincronizar Nuevas Listas de Tareas
        </button>
    </div>

    <div class="notification-container" id="notification"></div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <script>
        
        // --- CONFIGURACIÓN DE FIREBASE (¡REVISE ESTE BLOQUE!) ---
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyBcdWMdR_xVCFFQQPcTGPhbw8DYykN4qUg", 
            authDomain: "app-de-tareas-80324.firebaseapp.com",
            projectId: "app-de-tareas-80324",
            storageBucket: "app-de-tareas-80324.firebasestorage.app",
            messagingSenderId: "166776767275",
            appId: "1:166776767275:web:a581ec25fc4c05063f3b6e",
            databaseURL: "https://app-de-tareas-80324-default-rtdb.firebaseio.com"
        };
        const app = firebase.initializeApp(FIREBASE_CONFIG);
        const database = app.database();
        const SYNC_REF = database.ref('estado_global');
        
        // --- TAREAS INICIALES HARCODEADAS (Fallback si Firebase está vacío) ---
        let tareasHenry = [
            "Luz de nichos", "Luz de ventas", "Mueble de teléfono", "Quiosco de electrodomesticos", 
            "Quiosco de videojuegos", "Baño", "Site", "Comedor", "Planta", "Archivos",
            "Iluminación de pacios y bodega", "Bodega", "Rejillas", "Canales", "Techo"
        ];
        
        let tareasCarlos = ["EN JUICIO"];
        
        let tareasAmmy = [
            "fachada", "Techo", "Puertas y Chapas", "Parqueo", "Pintura Gris", 
            "Lienzo Azteca", "Pintura General", "Recorrido Virtual"
        ];
        
        // --- FUNCIONES DE NOTIFICACIÓN ---
        function mostrarNotificacion(message, isError = false) {
            const notification = document.getElementById('notification');
            notification.innerHTML = message;
            
            notification.style.background = isError ? 'var(--accent-red)' : 'var(--accent-success)';
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // --- FUNCION NUEVA para actualizar el Dashboard ---
        function updateDashboardCounts() {
            const countHenry = tareasHenry.length;
            const countCarlos = tareasCarlos.length;
            const countAmmy = tareasAmmy.length;
            const countTotal = countHenry + countCarlos + countAmmy;
            
            document.getElementById('count-henry').textContent = countHenry;
            document.getElementById('count-carlos').textContent = countCarlos;
            document.getElementById('count-ammy').textContent = countAmmy;
            document.getElementById('count-total').textContent = countTotal;
        }
        
        // --- FUNCIONES DE CARGA Y GUARDADO DE DEFINICIONES ---
        
        function loadTaskDefinitionsToEditor() {
            // Muestra las tareas cargadas (de Firebase o el fallback) en los textareas
            document.getElementById('tasks-henry-textarea').value = tareasHenry.join('\n');
            document.getElementById('tasks-carlos-textarea').value = tareasCarlos.join('\n');
            document.getElementById('tasks-ammy-textarea').value = tareasAmmy.join('\n');

            // ¡ACTUALIZACIÓN! Llamamos a la función de conteo aquí
            updateDashboardCounts();
        }

        async function cargarDefiniciones() {
            try {
                const snapshot = await SYNC_REF.once('value'); 
                
                if (snapshot.exists() && snapshot.val().taskDefinitions) {
                    const data = snapshot.val().taskDefinitions;
                    
                    // Sobreescribe el fallback con los datos de Firebase
                    if (data.Henry) tareasHenry = data.Henry;
                    if (data.Carlos) tareasCarlos = data.Carlos;
                    if (data.Ammy) tareasAmmy = data.Ammy;
                    
                    mostrarNotificacion("<i class='fas fa-sync-alt'></i> Listas de tareas cargadas desde Firebase.");
                } else {
                    mostrarNotificacion("⚠️ No se encontraron listas en Firebase. Usando listas de fallback para edición.", true);
                }
                
            } catch (error) {
                console.error("Error al cargar definiciones de tareas:", error);
                mostrarNotificacion("<i class='fas fa-exclamation-circle'></i> Error al cargar datos. Usando fallback.", true);
            } finally {
                loadTaskDefinitionsToEditor(); // Llena los textareas y actualiza el dashboard
            }
        }
        
        async function saveTaskDefinitionsFromEditor() {
            if (!confirm("⚠️ ¿Estás seguro de que quieres REEMPLAZAR la lista de tareas en Firebase? Esto afectará inmediatamente al panel de tareas principal.")) {
                 mostrarNotificacion("Guardado de tareas cancelado.");
                 return;
            }
            
            const btn = document.getElementById('save-tasks-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';

            // 1. Obtener los nuevos arrays de tareas limpiando y normalizando
            const newTareasHenry = document.getElementById('tasks-henry-textarea').value
                .split('\n')
                .map(t => t.trim())
                .filter(t => t !== '');
            
            const newTareasCarlos = document.getElementById('tasks-carlos-textarea').value
                .split('\n')
                .map(t => t.trim())
                .filter(t => t !== '');
            
            const newTareasAmmy = document.getElementById('tasks-ammy-textarea').value
                .split('\n')
                .map(t => t.trim())
                .filter(t => t !== '');

            const taskDefinitions = {
                Henry: newTareasHenry,
                Carlos: newTareasCarlos,
                Ammy: newTareasAmmy
            };
            
            // Opcional: Actualizar las variables locales antes de guardar para refrescar el dashboard inmediatamente
            tareasHenry = newTareasHenry;
            tareasCarlos = newTareasCarlos;
            tareasAmmy = newTareasAmmy;
            updateDashboardCounts();


            try {
                // 2. ACTUALIZAR SOLO taskDefinitions en Firebase. 
                await SYNC_REF.update({
                    taskDefinitions: taskDefinitions,
                    lastUpdatedDefinitions: new Date().toISOString()
                });
                
                mostrarNotificacion("<i class='fas fa-check-circle'></i> ¡Listas de tareas actualizadas y guardadas exitosamente!");
                
            } catch (error) {
                console.error("Error al guardar definiciones de tareas:", error);
                mostrarNotificacion("<i class='fas fa-exclamation-triangle'></i> ERROR al guardar tareas en Firebase.", true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Guardar y Sincronizar Nuevas Listas de Tareas';
            }
        }

        // --- EVENTOS ---
        window.addEventListener('DOMContentLoaded', () => {
            cargarDefiniciones(); 
            document.getElementById('save-tasks-btn').addEventListener('click', saveTaskDefinitionsFromEditor);
            
            // Opcional: Actualizar el conteo mientras se escribe para retroalimentación instantánea
            document.getElementById('tasks-henry-textarea').addEventListener('input', () => updateDashboardCountsOnChange('Henry'));
            document.getElementById('tasks-carlos-textarea').addEventListener('input', () => updateDashboardCountsOnChange('Carlos'));
            document.getElementById('tasks-ammy-textarea').addEventListener('input', () => updateDashboardCountsOnChange('Ammy'));
        });
        
        // --- FUNCION ADICIONAL para retroalimentación mientras se escribe ---
        function updateDashboardCountsOnChange(user) {
            const textarea = document.getElementById(`tasks-${user.toLowerCase()}-textarea`);
            
            // Obtenemos el array temporal de tareas del textarea
            const tempTareas = textarea.value
                .split('\n')
                .map(t => t.trim())
                .filter(t => t !== '');
            
            // Actualizamos los contadores visuales con los valores actuales en los textareas
            document.getElementById('count-henry').textContent = document.getElementById('tasks-henry-textarea').value.split('\n').map(t => t.trim()).filter(t => t !== '').length;
            document.getElementById('count-carlos').textContent = document.getElementById('tasks-carlos-textarea').value.split('\n').map(t => t.trim()).filter(t => t !== '').length;
            document.getElementById('count-ammy').textContent = document.getElementById('tasks-ammy-textarea').value.split('\n').map(t => t.trim()).filter(t => t !== '').length;
            
            const total = parseInt(document.getElementById('count-henry').textContent) + 
                          parseInt(document.getElementById('count-carlos').textContent) + 
                          parseInt(document.getElementById('count-ammy').textContent);
                          
            document.getElementById('count-total').textContent = total;
        }
    </script>
</body>
</html>
